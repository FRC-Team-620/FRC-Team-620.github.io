name: Automated update reminder

on:
  schedule:
    - cron: '0 13 1 7 *'
  
  workflow_dispatch: 

permissions:
  issues: write

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps: 
      - name: Create annual issue
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_YEAR=$(date +'%Y')
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Annual review and maintenance ($CURRENT_YEAR)" \
            --body "This is your annual reminder to update the website with any new information, pictures, ect." \
            --label "automated,enhancement"
